name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Package app
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name Hamkaraneh
          --hidden-import tkinter --hidden-import tkinter.ttk
          --hidden-import tkinter.filedialog --hidden-import tkinter.simpledialog
          hamkaraneh.py
      - name: Self-test packaged app (two computers talking)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process -FilePath 'dist\Hamkaraneh\Hamkaraneh.exe' -ArgumentList @('--selftest', $out) -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error 'Self-test timed out'; exit 1 }
          if (Test-Path $out) { Get-Content $out -Encoding UTF8 } else { Write-Error 'No self-test result file'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error 'Self-test FAILED'; exit 1 }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" Hamkaraneh.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hamkaraneh-Setup
          path: output/Hamkaraneh-Setup.exe
          if-no-files-found: error
          retention-days: 30
