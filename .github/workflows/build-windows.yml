name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install app and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Package self-contained Windows server
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name Hamkaraneh --collect-all fastapi --collect-all starlette
          --collect-all uvicorn --collect-all multipart --collect-all python_multipart
          --collect-all itsdangerous --collect-all anyio --collect-all h11
          --collect-submodules websockets --collect-submodules httptools
          --hidden-import multipart --hidden-import python_multipart
          --hidden-import tkinter --hidden-import main
          launcher.py
      - name: Smoke test packaged server
        shell: pwsh
        env:
          HAMKARANEH_NO_BROWSER: '1'
          HAMKARANEH_NO_GUI: '1'
        run: |
          $p = Start-Process -FilePath "dist\Hamkaraneh\Hamkaraneh.exe" -PassThru
          $log = Join-Path $env:ProgramData "Hamkaraneh\server.log"
          $ok = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri http://127.0.0.1:8000/login -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if ($ok) {
              $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
              $body = @{ username = 'admin'; password = 'ChangeMe123!' }
              $r2 = Invoke-WebRequest -Uri http://127.0.0.1:8000/login -Method Post -Body $body -WebSession $s -UseBasicParsing
              if ($r2.Content -notmatch 'api/files') { $ok = $false; Write-Host 'Login smoke test failed' }
            }
          } finally {
            if (Test-Path $log) { Write-Host '--- server.log ---'; Get-Content $log -Tail 100 }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not $ok) { Write-Error 'Packaged server failed the smoke test'; exit 1 }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" Hamkaraneh.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hamkaraneh-Setup-x64
          path: output/Hamkaraneh-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
