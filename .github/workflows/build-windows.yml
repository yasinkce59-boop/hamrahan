name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install app and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Package self-contained Windows server
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name Hamkaraneh --collect-all fastapi --collect-all starlette
          --collect-all uvicorn --collect-all multipart --collect-all itsdangerous
          launcher.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" Hamkaraneh.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hamkaraneh-Setup-x64
          path: output/Hamkaraneh-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
